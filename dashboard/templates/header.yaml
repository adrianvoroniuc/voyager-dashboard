button_card_templates:

  lcars_header:

    show_icon: false
    show_state: false

    styles:

      card:
        - background: transparent
        - box-shadow: none
        - border: none
        - padding: 12px

      grid:
        - grid-template-areas: '"name clock"'
        - grid-template-columns: 1fr auto

      name:
        - justify-self: start
        - font-size: 38px
        - color: var(--lcars-gold)
        - font-weight: 700

      custom_fields:

        clock:
          - justify-self: end
          - font-size: 24px
          - color: var(--lcars-orange-light)

    custom_fields:

      clock: >
        [[[
          return new Date().toLocaleTimeString([], {
            hour:'2-digit',
            minute:'2-digit'
          });
        ]]]