title: Operations
path: operations
icon: mdi:starship

type: custom:layout-card
layout_type: custom:grid-layout

layout:
  grid-template-columns: 220px 1fr
  grid-template-rows: auto 1fr
  grid-template-areas: |
    "sidebar header"
    "sidebar content"
  margin: 0
  grid-gap: 16px

cards:

  #########################################################################
  # Sidebar
  #########################################################################

  - type: vertical-stack
    view_layout:
      grid-area: sidebar

    cards:

      - type: custom:button-card
        template: lcars_header
        name: USS VOYAGER

      - type: custom:button-card
        template: lcars_nav
        name: Operations
        icon: mdi:starship

      - type: custom:button-card
        template: lcars_nav
        name: Lighting

      - type: custom:button-card
        template: lcars_nav
        name: Security

      - type: custom:button-card
        template: lcars_nav
        name: Engineering

      - type: custom:button-card
        template: lcars_nav
        name: Aquarium

  #########################################################################
  # Header
  #########################################################################

  - type: markdown
    view_layout:
      grid-area: header
    content: |
      # USS VOYAGER

      **All Systems Nominal**

  #########################################################################
  # Content
  #########################################################################

  - type: vertical-stack
    view_layout:
      grid-area: content

    cards:

      #########################################################
      # Room Grid
      #########################################################

      - type: grid
        columns: 3
        square: false

        cards:

          - type: custom:button-card
            template: lcars_room
            entity: switch.living_room_living
            name: Living Room
            icon: mdi:sofa

          - type: custom:button-card
            template: lcars_room
            entity: light.kitchen_led
            name: Kitchen
            icon: mdi:silverware-fork-knife

          - type: custom:button-card
            template: lcars_room
            entity: switch.dining_room_dinning_switch
            name: Dining
            icon: mdi:table-chair

          - type: custom:button-card
            template: lcars_room
            entity: light.lobby_govee_ceiling_light
            name: Lobby
            icon: mdi:door

          - type: custom:button-card
            template: lcars_room
            entity: light.bedroom_led
            name: Bedroom
            icon: mdi:bed

          - type: custom:button-card
            template: lcars_room
            entity: switch.co2_socket_1
            name: Aquarium
            icon: mdi:fishbowl

      #########################################################
      # Ship Status
      #########################################################

      - type: grid
        columns: 3
        square: false

        cards:

          - type: markdown
            content: |
              ## CPU
              _Coming next_

          - type: markdown
            content: |
              ## Memory
              _Coming next_

          - type: markdown
            content: |
              ## Weather
              _Coming next_

      #########################################################
      # Cameras
      #########################################################

      - type: markdown
        content: |
          ## Doorbell Camera

          _(Commit 009)_

      #########################################################
      # Alerts
      #########################################################

      - type: markdown
        content: |
          ## 🟢 All Systems Nominal